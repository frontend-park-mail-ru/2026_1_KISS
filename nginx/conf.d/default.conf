server {
    listen 80;
    server_name colkiss.ru www.colkiss.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://colkiss.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.colkiss.ru;

    ssl_certificate     /etc/letsencrypt/live/colkiss.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colkiss.ru/privkey.pem;

    return 301 https://colkiss.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name colkiss.ru;

    ssl_certificate     /etc/letsencrypt/live/colkiss.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colkiss.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /app/dist;
    access_log /var/log/nginx/access.log debug_proxy;

    server_tokens off;
    autoindex off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://yookassa.ru https://static.yoomoney.ru; style-src 'self' 'unsafe-inline' https://yookassa.ru; img-src 'self' data: blob: https://yookassa.ru https://static.yoomoney.ru; connect-src 'self' https://yookassa.ru https://static.yoomoney.ru; frame-src https://yookassa.ru https://yoomoney.ru; font-src 'self' https://yookassa.ru;" always;

    location /api/ {
        proxy_pass http://212.233.96.54:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade для /api/v1/ws/notebooks/{id}
        # $http_upgrade пуст для обычных HTTP-запросов, поэтому это не ломает остальной /api/.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location ^~ /uploads/ {
        proxy_pass http://212.233.96.54:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /mail/ {
        proxy_pass https://127.0.0.1:8443/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect https://127.0.0.1:8443/ /mail/;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    location ^~ /grafana/ {
        proxy_pass http://212.233.96.54:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /sw.js {
        try_files /sw.js =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://yookassa.ru https://static.yoomoney.ru; style-src 'self' 'unsafe-inline' https://yookassa.ru; img-src 'self' data: blob: https://yookassa.ru https://static.yoomoney.ru; connect-src 'self' https://yookassa.ru https://static.yoomoney.ru; frame-src https://yookassa.ru https://yoomoney.ru; font-src 'self' https://yookassa.ru;" always;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|otf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location = /feedback {
        try_files /feedback.html =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
