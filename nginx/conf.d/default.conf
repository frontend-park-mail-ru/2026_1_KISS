server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log debug_proxy;
    root /app/src;

    server_tokens off;
    autoindex off;
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # API proxy to backend
    location /api/ {
        proxy_pass http://212.233.96.54:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handlebars runtime from node_modules
    location = /handlebars/dist/handlebars.runtime.js {
        root /app/node_modules;
        try_files /handlebars/dist/handlebars.runtime.js =404;
    }

    # Cache static assets
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri /app/index.html;
    }
}
