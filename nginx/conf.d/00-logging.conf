log_format debug_proxy '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'proxy_to: "$upstream_addr" '
                       'proxy_status: "$upstream_status" '
                       'req_time: $request_time '
                       'upstream_time: "$upstream_response_time" '
                       'cache_status: "$upstream_cache_status" '
                       'file: "$request_filename" '
                       'root: "$document_root" '
                       'uri: "$uri"';

# Маппинг для WebSocket upgrade в /api/ — пустой Upgrade означает обычный
# HTTP, ставим Connection: close, иначе Connection: upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
